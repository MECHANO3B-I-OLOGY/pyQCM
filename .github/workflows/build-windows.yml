name: Build pyQCM Windows EXE
on: [push, pull, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10.19
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.19'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pandas==1.4.3 numpy==1.24.3 matplotlib==3.8.4 scipy==1.9.3 datetime==4.7 xlrd==2.0.1 openpyxl==3.1.4

      - name: Build EXE
        run: pyinstaller pyQCM.spec

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: pyQCM-Windows-Build
          path: dist/pyQCM.exe