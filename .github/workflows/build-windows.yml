name: Build pyQCM Windows EXE
on: [push, pull_request, workflow_dispatch]
# on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python 3.10.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pandas==1.4.3 numpy==1.24.3 matplotlib==3.8.4 scipy==1.9.3 datetime==4.7 xlrd==2.0.1 openpyxl==3.1.4

      - name: Build EXE
        run: pyinstaller windowsExec.spec

      - name: Package Non-Ignored Files + EXE
        shell: pwsh
        run: |
          $stagingDir = "package"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          git ls-files --cached --others --exclude-standard | ForEach-Object {
            $src = $_
            # Skip generated runtime outputs to avoid shipping stale state.
            if (
              $src -like "selected_ranges/*.csv" -or
              $src -like "raw_data/Formatted-*.csv" -or
              $src -like "sample_generations/*/*.csv" -or
              $src -like "qcmd-plots/*" -or
              $src -like "qcmd-plots/**/*"
            ) {
              return
            }
            if (Test-Path $src -PathType Leaf) {
              $dest = Join-Path $stagingDir $src
              $destDir = Split-Path $dest -Parent
              if ($destDir) {
                New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              }
              Copy-Item -Path $src -Destination $dest -Force
            }
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $stagingDir "selected_ranges") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stagingDir "qcmd-plots") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stagingDir "qcmd-plots/modeling") | Out-Null

          # Seed required stats files with headers to keep runtime state clean and readable on first run.
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/clean_all_stats_rf.csv") -Value "overtone,Dfreq_average,Dfreq_std_dev,Dfreq_median,range_name,x_lower,x_upper,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/clean_all_stats_dis.csv") -Value "overtone,Ddis_average,Ddis_std_dev,Ddis_median,range_name,x_lower,x_upper,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/raw_all_stats_rf.csv") -Value "overtone,Dfreq_average,Dfreq_std_dev,Dfreq_median,range_name,x_lower,x_upper,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/raw_all_stats_dis.csv") -Value "overtone,Ddis_average,Ddis_std_dev,Ddis_median,range_name,x_lower,x_upper,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/Sauerbrey_stats.csv") -Value "overtone,avg_Df,std_dev_Df,avg_Dm,std_dev_Dm,C,range_name,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/Sauerbrey_ranges.csv") -Value "range_name,lower_bound,upper_bound,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/sauerbrey_output.csv") -Value "avg_Df,avg_Dm,range_name,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/thin_film_liquid_output.csv") -Value "n*Df,bandwidth_shift,bandwidth_shift_FIT,range_name,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/thin_film_air_output.csv") -Value "sq_overtones,delta_gamma_norm,delta_gamma_norm_fit,delta_freqs_norm,delta_freq_norm_fit,range_name,data_source"
          Set-Content -Path (Join-Path $stagingDir "selected_ranges/crystal_thickness_output.csv") -Value "overtone,offset_vals,offset_vals_FIT"

          Copy-Item -Path dist/pyQCMWindows.exe -Destination (Join-Path $stagingDir "pyQCMWindows.exe") -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyQCM-Windows-Package
          path: package/**
          include-hidden-files: true