name: Build standalone apps

# - every push to the default branch and every pull request: build + smoke test Windows and macOS apps, upload as workflow artifacts
# - pushing a version tag (e.g. b.1.4.0): also creates a DRAFT GitHub Release with the zips attached,
#   review it on the Releases page and click 'Publish release' to make it the download users get
on:
  push:
    branches: [master, main]
    tags: ['b.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.10.11'
  PYINSTALLER_VERSION: '6.22.3'

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==${{ env.PYINSTALLER_VERSION }}

      - name: Build EXE
        run: pyinstaller --noconfirm windowsExec.spec

      - name: Smoke test (launched from a different folder)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item dist/pyQCMWindows.exe $smokeDir
          Set-Location $env:RUNNER_TEMP
          & (Join-Path $smokeDir "pyQCMWindows.exe") --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed with exit code $LASTEXITCODE" }

      - name: Package zip
        shell: pwsh
        # data folders (plot_opts, offset_data, sample_generations, ...) are created next to the exe on first launch
        run: |
          New-Item -ItemType Directory -Force -Path pyQCM-Windows | Out-Null
          Copy-Item dist/pyQCMWindows.exe, README.md, LICENSE pyQCM-Windows/
          Compress-Archive -Path pyQCM-Windows -DestinationPath pyQCM-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyQCM-Windows
          path: pyQCM-Windows.zip
          retention-days: 30

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==${{ env.PYINSTALLER_VERSION }}

      - name: Build app
        run: pyinstaller --noconfirm macExec.spec

      - name: Smoke test (launched from / like Finder does)
        timeout-minutes: 10
        # temporary HOME so the data folder (~/Documents/pyQCM) is created in a throwaway location
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME/Documents"
          cd /
          "$GITHUB_WORKSPACE/dist/pyQCM.app/Contents/MacOS/pyQCM" --smoke-test

      - name: Package zip
        # ditto keeps the .app bundle's symlinks, permissions, and signature intact (plain zip/upload-artifact do not)
        run: ditto -c -k --sequesterRsrc --keepParent dist/pyQCM.app pyQCM-macOS-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyQCM-macOS-${{ matrix.arch }}
          path: pyQCM-macOS-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/b.')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build zips
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "pyQCM $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
